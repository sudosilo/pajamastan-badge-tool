<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Tool</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1a1d23;
    --muted: #5b6472;
    --line: #d5d9e0;
    --accent: #1f4e9c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type="text"], textarea, select { width: 100%; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  input[type="range"] { width: 100%; }
  input[type="color"] { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 2px; }
  input[type="file"] { width: 100%; font-size: 15px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px; color: var(--ink); }
  .check input { width: 20px; height: 20px; }
  button { font-size: 16px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; width: 100%; margin-top: 12px; }
  button.alt { background: #fff; color: var(--accent); }
  button.small { width: auto; margin: 0; padding: 8px 10px; font-size: 14px; }
  .preview-label { font-size: 13px; color: var(--muted); margin: 6px 0; }
  .stage { display: flex; justify-content: center; padding: 8px 0 4px; overflow-x: auto; }

  /* badge, credit card size */
  .badge {
    width: 3.375in; height: 2.125in; background: #ffffff; color: #111; position: relative; overflow: hidden;
    border: 1px solid #c9ced6; border-radius: 0.125in; flex: none;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .badge .band { position: absolute; left: 0; top: 0; right: 0; height: 0.42in; background: var(--badge-accent, #1f4e9c); display: flex; align-items: center; padding: 0 0.14in; }
  .badge .band span { color: #fff; font-weight: 700; font-size: 11pt; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge .photo { position: absolute; left: 0.14in; top: 0.56in; width: 1.05in; height: 1.35in; border: 1px solid #9aa3b0; background: #e8ebf0; overflow: hidden; }
  .badge .photo img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: center center; }
  .badge .info { position: absolute; left: 1.35in; right: 0.12in; top: 0.58in; }
  .badge .nm { font-size: 14pt; font-weight: 800; line-height: 1.1; word-wrap: break-word; }
  .badge .rl { font-size: 9.5pt; color: #333; margin-top: 0.06in; line-height: 1.15; }
  .badge .meta { position: absolute; left: 1.35in; right: 0.12in; bottom: 0.14in; font-size: 8pt; color: #333; line-height: 1.3; }
  .badge .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 0.07in; background: var(--badge-accent, #1f4e9c); }
  .badge.back .band { height: 0.3in; }
  .badge.back .btxt { position: absolute; left: 0.16in; right: 0.16in; top: 0.45in; bottom: 0.2in; font-size: 9pt; line-height: 1.35; white-space: pre-wrap; word-wrap: break-word; overflow: hidden; }

  .roster-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .roster-item:first-child { border-top: none; }
  .roster-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster-item .btns { display: flex; gap: 6px; }
  .empty { color: var(--muted); font-size: 14px; }

  #printarea { display: none; }

  @page { size: 3.375in 2.125in; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .wrap { display: none !important; }
    #printarea { display: block; }
    #printarea .badge { border: none; border-radius: 0; page-break-after: always; break-after: page; }
    #printarea .badge:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Badge Tool</h1>

  <div class="panel">
    <div class="preview-label">Front</div>
    <div class="stage"><div class="badge" id="front"></div></div>
    <div id="backWrap" style="display:none">
      <div class="preview-label">Back</div>
      <div class="stage"><div class="badge back" id="back"></div></div>
    </div>
  </div>

  <div class="panel">
    <label for="photoIn">Photo</label>
    <input type="file" id="photoIn" accept="image/*">
    <div class="row">
      <div>
        <label for="zoom">Zoom</label>
        <input type="range" id="zoom" min="100" max="300" value="100">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="panx">Move left or right</label>
        <input type="range" id="panx" min="-50" max="50" value="0">
      </div>
      <div>
        <label for="pany">Move up or down</label>
        <input type="range" id="pany" min="-50" max="50" value="0">
      </div>
    </div>

    <label for="name">Name</label>
    <input type="text" id="name" value="xxxx xxxxxxxx" autocomplete="off">

    <div class="row">
      <div>
        <label for="role">Role</label>
        <input type="text" id="role" value="xxxxxxxxxx" autocomplete="off">
      </div>
      <div>
        <label for="idnum">ID number</label>
        <input type="text" id="idnum" value="xxxxxx" autocomplete="off">
      </div>
    </div>

    <label for="org">Organization name on the top band</label>
    <input type="text" id="org" value="xxxxxxxxxxxxxxxx" autocomplete="off">

    <div class="row">
      <div>
        <label for="issued">Issued</label>
        <input type="text" id="issued" value="xxxx-xx-xx" autocomplete="off">
      </div>
      <div>
        <label for="expires">Expires</label>
        <input type="text" id="expires" value="xxxx-xx-xx" autocomplete="off">
      </div>
    </div>

    <label for="accent">Band color</label>
    <input type="color" id="accent" value="#1f4e9c">

    <div class="check">
      <input type="checkbox" id="useBack">
      <span>Include a back side</span>
    </div>
    <div id="backFields" style="display:none">
      <label for="backText">Back side text</label>
      <textarea id="backText">xxxxxxxxxxxxxxxxxxxx
xxxxxxxxxxxxxxxxxxxx</textarea>
    </div>

    <button id="printBtn">Print badge</button>
    <button class="alt" id="saveBtn">Save to roster</button>
    <button class="alt" id="clearPhoto">Remove photo</button>
  </div>

  <div class="panel">
    <div class="preview-label">Saved on this phone</div>
    <div id="roster"></div>
  </div>
</div>

<div id="printarea"></div>

<script>
(function () {
  var KEY = 'badge_tool_roster_v1';
  var $ = function (id) { return document.getElementById(id); };
  var state = { photo: '' };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function vals() {
    return {
      name: $('name').value,
      role: $('role').value,
      idnum: $('idnum').value,
      org: $('org').value,
      issued: $('issued').value,
      expires: $('expires').value,
      accent: $('accent').value,
      useBack: $('useBack').checked,
      backText: $('backText').value,
      zoom: $('zoom').value,
      panx: $('panx').value,
      pany: $('pany').value,
      photo: state.photo
    };
  }

  function frontHTML(v) {
    var tf = 'transform: translate(' + v.panx + '%, ' + v.pany + '%) scale(' + (v.zoom / 100) + ');';
    var img = v.photo ? '<img src="' + v.photo + '" style="' + tf + '" alt="">' : '';
    var meta = '';
    if (v.idnum) meta += 'ID ' + esc(v.idnum) + '<br>';
    if (v.issued) meta += 'Issued ' + esc(v.issued) + '<br>';
    if (v.expires) meta += 'Expires ' + esc(v.expires);
    return '<div class="band"><span>' + esc(v.org) + '</span></div>' +
      '<div class="photo">' + img + '</div>' +
      '<div class="info"><div class="nm">' + esc(v.name) + '</div><div class="rl">' + esc(v.role) + '</div></div>' +
      '<div class="meta">' + meta + '</div>' +
      '<div class="stripe"></div>';
  }

  function backHTML(v) {
    return '<div class="band"><span>' + esc(v.org) + '</span></div>' +
      '<div class="btxt">' + esc(v.backText) + '</div>' +
      '<div class="stripe"></div>';
  }

  function render() {
    var v = vals();
    document.documentElement.style.setProperty('--badge-accent', v.accent);
    $('front').innerHTML = frontHTML(v);
    $('backWrap').style.display = v.useBack ? 'block' : 'none';
    $('backFields').style.display = v.useBack ? 'block' : 'none';
    $('back').innerHTML = backHTML(v);
  }

  function resizeToDataURL(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var im = new Image();
      im.onload = function () {
        var max = 700;
        var w = im.width, h = im.height;
        var s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * s);
        c.height = Math.round(h * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.88));
      };
      im.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  $('photoIn').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    resizeToDataURL(f, function (url) {
      state.photo = url;
      $('zoom').value = 100; $('panx').value = 0; $('pany').value = 0;
      render();
    });
  });

  $('clearPhoto').addEventListener('click', function () {
    state.photo = '';
    $('photoIn').value = '';
    render();
  });

  ['name', 'role', 'idnum', 'org', 'issued', 'expires', 'accent', 'useBack', 'backText', 'zoom', 'panx', 'pany']
    .forEach(function (id) {
      $(id).addEventListener('input', render);
      $(id).addEventListener('change', render);
    });

  $('printBtn').addEventListener('click', function () {
    var v = vals();
    var html = '<div class="badge">' + frontHTML(v) + '</div>';
    if (v.useBack) html += '<div class="badge back">' + backHTML(v) + '</div>';
    $('printarea').innerHTML = html;
    window.print();
  });

  /* roster */
  function loadRoster() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
  }
  function saveRoster(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
  }

  function drawRoster() {
    var list = loadRoster();
    var box = $('roster');
    if (!list.length) { box.innerHTML = '<div class="empty">Nothing saved yet.</div>'; return; }
    box.innerHTML = '';
    list.forEach(function (item, i) {
      var row = document.createElement('div');
      row.className = 'roster-item';
      row.innerHTML = '<div class="nm">' + esc(item.name || 'Unnamed') + '</div>' +
        '<div class="btns"><button class="small alt" data-load="' + i + '">Load</button>' +
        '<button class="small alt" data-del="' + i + '">Delete</button></div>';
      box.appendChild(row);
    });
  }

  $('roster').addEventListener('click', function (e) {
    var t = e.target;
    var list = loadRoster();
    if (t.getAttribute('data-load') !== null) {
      var it = list[parseInt(t.getAttribute('data-load'), 10)];
      if (!it) return;
      $('name').value = it.name; $('role').value = it.role; $('idnum').value = it.idnum;
      $('org').value = it.org; $('issued').value = it.issued; $('expires').value = it.expires;
      $('accent').value = it.accent; $('useBack').checked = !!it.useBack; $('backText').value = it.backText;
      $('zoom').value = it.zoom; $('panx').value = it.panx; $('pany').value = it.pany;
      state.photo = it.photo || '';
      render();
      window.scrollTo(0, 0);
    } else if (t.getAttribute('data-del') !== null) {
      list.splice(parseInt(t.getAttribute('data-del'), 10), 1);
      saveRoster(list);
      drawRoster();
    }
  });

  $('saveBtn').addEventListener('click', function () {
    var v = vals();
    var list = loadRoster();
    var idx = -1;
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === v.name && list[i].idnum === v.idnum) { idx = i; break; }
    }
    if (idx >= 0) list[idx] = v; else list.push(v);
    if (!saveRoster(list)) { alert('Storage is full. Delete a saved badge and try again.'); return; }
    drawRoster();
  });

  render();
  drawRoster();
})();
</script>
</body>
</html>
