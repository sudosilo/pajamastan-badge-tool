<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Tool</title>
<style id="pageStyle">@page { size: 3.375in 2.125in; margin: 0; }</style>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1a1d23;
    --muted: #5b6472;
    --line: #d5d9e0;
    --accent: #1f4e9c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 14px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type="text"], textarea, select { width: 100%; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  input[type="range"] { width: 100%; }
  input[type="color"] { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 2px; }
  input[type="file"] { width: 100%; font-size: 15px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px; color: var(--ink); }
  .check input { width: 20px; height: 20px; }
  button { font-size: 16px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; width: 100%; margin-top: 12px; }
  button.alt { background: #fff; color: var(--accent); }
  button.small { width: auto; margin: 0; padding: 8px 10px; font-size: 14px; }
  .preview-label { font-size: 13px; color: var(--muted); margin: 6px 0; }
  .stage { display: flex; justify-content: center; padding: 8px 0 4px; overflow-x: auto; }

  /* tabs */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { margin: 0; flex: 1; background: #fff; color: var(--accent); }
  .tabs button.on { background: var(--accent); color: #fff; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .chips button { margin: 0; width: auto; white-space: nowrap; padding: 9px 12px; font-size: 14px; background: #fff; color: var(--accent); flex: none; }
  .chips button.on { background: var(--accent); color: #fff; }

  /* badge, credit card size, landscape default */
  .badge {
    width: 3.375in; height: 2.125in; background: var(--badge-bg, #ffffff); color: #111; position: relative; overflow: hidden;
    border: 1px solid #c9ced6; border-radius: 0.125in; flex: none;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .badge .band { position: absolute; left: 0; top: 0; right: 0; height: 0.42in; background: var(--band-fill, #1f4e9c); display: flex; align-items: center; padding: 0 0.14in; }
  .badge .band span { color: #fff; font-weight: 700; font-size: 11pt; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge .photo { position: absolute; left: 0.14in; top: 0.56in; width: 1.05in; height: 1.35in; border: 1px solid #9aa3b0; background: #e8ebf0; overflow: hidden; }
  .badge .photo img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: center center; }
  .badge .photo.clean { background: #ffffff; }
  .badge .photo .wm { position: absolute; object-fit: contain; pointer-events: none; }
  .badge .photo .wm.behind { z-index: 1; }
  .badge .photo img.pic { z-index: 2; }
  .badge .photo .wm.over { z-index: 3; }
  .badge .photo .ov { position: absolute; left: 50%; top: 50%; z-index: 4; transform: translate(-50%, -50%) rotate(-24deg); white-space: nowrap; font-weight: 800; line-height: 1.2; text-align: center; pointer-events: none; text-transform: uppercase; }
  .badge .info { position: absolute; left: 1.35in; right: 0.12in; top: 0.58in; }
  .badge .nm { font-size: 14pt; font-weight: 800; line-height: 1.1; word-wrap: break-word; }
  .badge .rl { font-size: 9.5pt; color: #333; margin-top: 0.06in; line-height: 1.15; }
  .badge .meta { position: absolute; left: 1.35in; right: 0.12in; bottom: 0.14in; font-size: 8pt; color: #333; line-height: 1.3; }
  .badge .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 0.07in; background: var(--band-fill, #1f4e9c); }
  .badge.back .band { height: 0.3in; }
  .badge.back .btxt { position: absolute; left: 0.16in; right: 0.16in; top: 0.45in; bottom: 0.2in; font-size: 9pt; line-height: 1.35; white-space: pre-wrap; word-wrap: break-word; overflow: hidden; }

  /* portrait */
  .badge.portrait { width: 2.125in; height: 3.375in; }
  .badge.portrait .photo { left: 0.4in; top: 0.56in; width: 1.325in; height: 1.6in; }
  .badge.portrait .info { left: 0.1in; right: 0.1in; top: 2.25in; text-align: center; }
  .badge.portrait .nm { font-size: 13pt; }
  .badge.portrait .meta { left: 0.1in; right: 0.1in; bottom: 0.15in; text-align: center; }
  .badge.portrait.back .btxt { top: 0.45in; }

  .ge-modes { display: flex; gap: 6px; }
  .ge-modes button { margin: 0; flex: 1; padding: 8px; font-size: 14px; background: #fff; color: var(--accent); }
  .ge-modes button.on { background: var(--accent); color: #fff; }
  .ge-barwrap { position: relative; margin: 12px 14px 0; }
  .ge-bar { height: 28px; border: 1px solid var(--line); border-radius: 6px; touch-action: none; }
  .ge-marks { position: relative; height: 36px; }
  .ge-mk { position: absolute; top: 5px; width: 24px; height: 24px; margin-left: -12px; border: 2px solid #fff; outline: 1px solid #555; border-radius: 4px; touch-action: none; }
  .ge-mk.sel { outline: 3px solid var(--accent); }
  .ge-row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .ge-row input[type="color"] { flex: 1; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .item:first-child { border-top: none; }
  .item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .btns { display: flex; gap: 6px; }
  .empty { color: var(--muted); font-size: 14px; }

  #printarea { display: none; }

  @media print {
    html, body { background: #fff; }
    .wrap { display: none !important; }
    #printarea { display: block; }
    #printarea .badge { border: none; border-radius: 0; page-break-after: always; break-after: page; }
    #printarea .badge:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Badge Tool</h1>

  <div class="tabs">
    <button id="modeL" class="on">Landscape</button>
    <button id="modeP">Portrait</button>
  </div>

  <div class="preview-label">Templates</div>
  <div class="chips" id="chips"></div>

  <div class="panel">
    <div class="preview-label">Front</div>
    <div class="stage"><div class="badge" id="front"></div></div>
    <div id="backWrap" style="display:none">
      <div class="preview-label">Back</div>
      <div class="stage"><div class="badge back" id="back"></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="preview-label">Person</div>
    <label for="photoIn">Photo</label>
    <input type="file" id="photoIn" accept="image/*">
    <label for="zoom">Zoom</label>
    <input type="range" id="zoom" min="100" max="300" value="100">
    <div class="row">
      <div>
        <label for="panx">Move left or right</label>
        <input type="range" id="panx" min="-50" max="50" value="0">
      </div>
      <div>
        <label for="pany">Move up or down</label>
        <input type="range" id="pany" min="-50" max="50" value="0">
      </div>
    </div>
    <div class="check">
      <input type="checkbox" id="bgOn">
      <span>Remove photo background</span>
    </div>
    <div id="bgFields" style="display:none">
      <label for="keyColor">Backdrop color to remove</label>
      <input type="color" id="keyColor" value="#00aa00">
      <label for="bgTol">Removal strength</label>
      <input type="range" id="bgTol" min="5" max="120" value="45">
    </div>
    <label for="name">Name</label>
    <input type="text" id="name" value="xxxx xxxxxxxx" autocomplete="off">
    <label for="idnum">ID number</label>
    <input type="text" id="idnum" value="xxxxxx" autocomplete="off">

    <button id="printBtn">Print badge</button>
    <button class="alt" id="savePerson">Save person under this template</button>
    <button class="alt" id="clearPhoto">Remove photo</button>
  </div>

  <div class="panel">
    <div class="preview-label">Template design</div>
    <label for="org">Organization name on the top band</label>
    <input type="text" id="org" value="xxxxxxxxxxxxxxxx" autocomplete="off">
    <label for="role">Job role</label>
    <input type="text" id="role" value="xxxxxxxxxx" autocomplete="off">
    <div class="row">
      <div>
        <label for="issued">Issued</label>
        <input type="text" id="issued" value="xxxx-xx-xx" autocomplete="off">
      </div>
      <div>
        <label for="expires">Expires</label>
        <input type="text" id="expires" value="xxxx-xx-xx" autocomplete="off">
      </div>
    </div>
    <label>Band color or gradient</label>
    <div id="geBand"></div>
    <label>Badge background color or gradient</label>
    <div id="geBg"></div>
    <div class="check">
      <input type="checkbox" id="useBack">
      <span>Include a back side</span>
    </div>
    <div id="backFields" style="display:none">
      <label for="backText">Back side text</label>
      <textarea id="backText">xxxxxxxxxxxxxxxxxxxx
xxxxxxxxxxxxxxxxxxxx</textarea>
    </div>

    <label for="wmIn">Watermark image (seal)</label>
    <input type="file" id="wmIn" accept="image/*">
    <label for="wmMode">Watermark placement</label>
    <select id="wmMode">
      <option value="off">Off</option>
      <option value="behind">Behind the person (needs background removal)</option>
      <option value="over">Over the photo</option>
    </select>
    <div class="row">
      <div>
        <label for="wmOpacity">Watermark strength</label>
        <input type="range" id="wmOpacity" min="5" max="100" value="40">
      </div>
      <div>
        <label for="wmSize">Watermark size</label>
        <input type="range" id="wmSize" min="40" max="160" value="100">
      </div>
    </div>
    <button class="alt" id="wmClear">Remove watermark image</button>

    <label for="ovText">Text printed over the photo</label>
    <input type="text" id="ovText" value="" placeholder="xxxxxxxx" autocomplete="off">
    <label>Text color or gradient</label>
    <div id="geOv"></div>
    <label for="ovOpacity">Text strength</label>
    <input type="range" id="ovOpacity" min="5" max="100" value="35">
    <label for="ovAngle">Text angle</label>
    <input type="range" id="ovAngle" min="-180" max="180" value="-24">
    <label for="ovSize">Text size</label>
    <input type="range" id="ovSize" min="6" max="40" value="16">

    <label for="tname">Template name</label>
    <input type="text" id="tname" value="" autocomplete="off">
    <button id="tNew">Save as new template</button>
    <button class="alt" id="tUpdate" style="display:none">Update this template</button>
    <button class="alt" id="tDelete" style="display:none">Delete this template</button>
  </div>

  <div class="panel">
    <div class="preview-label" id="rosterTitle">People saved under this template</div>
    <div id="roster"></div>
  </div>
</div>

<div id="printarea"></div>

<script>
(function () {
  var KEY = 'badge_tool_v2';
  var $ = function (id) { return document.getElementById(id); };
  var state = { photo: '', shown: '', wm: '', orientation: 'landscape', tid: '' };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* storage */
  function loadDB() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && d.templates && d.people) return d;
    } catch (e) {}
    return { templates: [], people: [], active: '' };
  }
  function saveDB(d) {
    try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { return false; }
  }
  var db = loadDB();

  function newId() { return 't' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36); }

  /* gradient editor */
  function sortedStops(g) { return g.stops.slice().sort(function (a, b) { return a.p - b.p; }); }
  function stopList(g) { return sortedStops(g).map(function (s) { return s.c + ' ' + s.p + '%'; }).join(','); }
  function cssOf(g) {
    if (g.mode !== 'gradient' || g.stops.length < 2) return g.stops[0].c;
    return 'linear-gradient(' + g.angle + 'deg,' + stopList(g) + ')';
  }
  function colorAt(g, p) {
    var s = sortedStops(g);
    if (p <= s[0].p) return s[0].c;
    if (p >= s[s.length - 1].p) return s[s.length - 1].c;
    for (var i = 0; i < s.length - 1; i++) {
      if (p >= s[i].p && p <= s[i + 1].p) {
        var span = (s[i + 1].p - s[i].p) || 1, f = (p - s[i].p) / span;
        var a = hexToRgb(s[i].c), b = hexToRgb(s[i + 1].c);
        return '#' + toHex(a[0] + (b[0] - a[0]) * f) + toHex(a[1] + (b[1] - a[1]) * f) + toHex(a[2] + (b[2] - a[2]) * f);
      }
    }
    return s[0].c;
  }
  function copyStops(a) { return a.map(function (s) { return { c: s.c, p: s.p }; }); }

  function makeGrad(root, init, onChange) {
    var g = { mode: init.mode, angle: init.angle, stops: copyStops(init.stops), sel: 0 };
    root.className = 'ge';
    root.innerHTML = '<div class="ge-modes"><button type="button" data-m="solid">Solid</button><button type="button" data-m="gradient">Gradient</button></div>' +
      '<div class="ge-go"><div class="ge-barwrap"><div class="ge-bar"></div><div class="ge-marks"></div></div></div>' +
      '<div class="ge-row"><input type="color" class="ge-color"><button type="button" class="small alt ge-del ge-go">Remove stop</button></div>' +
      '<div class="ge-go"><label>Gradient angle</label><input type="range" class="ge-angle" min="0" max="360"></div>';
    var q = function (sel) { return root.querySelector(sel); };
    var bar = q('.ge-bar'), marks = q('.ge-marks'), colorIn = q('.ge-color'), delBtn = q('.ge-del'), angleIn = q('.ge-angle');
    var modeBtns = root.querySelectorAll('.ge-modes button');
    var gos = root.querySelectorAll('.ge-go');

    function refresh() {
      var grad = g.mode === 'gradient';
      var i;
      for (i = 0; i < gos.length; i++) gos[i].style.display = grad ? '' : 'none';
      for (i = 0; i < modeBtns.length; i++) modeBtns[i].className = modeBtns[i].getAttribute('data-m') === g.mode ? 'on' : '';
      bar.style.background = 'linear-gradient(90deg,' + stopList(g) + ')';
      var mk = marks.children;
      for (i = 0; i < mk.length; i++) {
        mk[i].style.left = g.stops[i].p + '%';
        mk[i].style.background = g.stops[i].c;
        mk[i].className = 'ge-mk' + (i === g.sel ? ' sel' : '');
      }
      var cur = grad ? g.stops[g.sel] : g.stops[0];
      colorIn.value = cur.c;
      angleIn.value = g.angle;
      delBtn.disabled = g.stops.length <= 2;
    }

    function build() {
      marks.innerHTML = '';
      g.stops.forEach(function (s, i) {
        var m = document.createElement('div');
        m.className = 'ge-mk';
        m.addEventListener('pointerdown', function (e) {
          e.preventDefault(); e.stopPropagation();
          g.sel = i; refresh();
          var rect = bar.getBoundingClientRect();
          var move = function (ev) {
            g.stops[i].p = Math.round(Math.max(0, Math.min(100, (ev.clientX - rect.left) / rect.width * 100)));
            refresh(); onChange();
          };
          var up = function () {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            window.removeEventListener('pointercancel', up);
          };
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', up);
          window.addEventListener('pointercancel', up);
        });
        marks.appendChild(m);
      });
      refresh();
    }

    bar.addEventListener('pointerdown', function (e) {
      var rect = bar.getBoundingClientRect();
      var p = Math.round(Math.max(0, Math.min(100, (e.clientX - rect.left) / rect.width * 100)));
      g.stops.push({ c: colorAt(g, p), p: p });
      g.sel = g.stops.length - 1;
      build(); onChange();
    });
    for (var mi = 0; mi < modeBtns.length; mi++) {
      modeBtns[mi].addEventListener('click', function (e) {
        g.mode = e.target.getAttribute('data-m');
        refresh(); onChange();
      });
    }
    colorIn.addEventListener('input', function () {
      var cur = g.mode === 'gradient' ? g.stops[g.sel] : g.stops[0];
      cur.c = colorIn.value;
      refresh(); onChange();
    });
    angleIn.addEventListener('input', function () {
      g.angle = parseInt(angleIn.value, 10);
      onChange();
    });
    delBtn.addEventListener('click', function () {
      if (g.stops.length <= 2) return;
      g.stops.splice(g.sel, 1);
      g.sel = 0;
      build(); onChange();
    });

    build();
    return {
      get: function () { return { mode: g.mode, angle: g.angle, stops: copyStops(g.stops) }; },
      set: function (o) { g.mode = o.mode; g.angle = o.angle; g.stops = copyStops(o.stops); g.sel = 0; build(); }
    };
  }

  function solidOf(c) { return { mode: 'solid', angle: 90, stops: [{ c: c, p: 0 }, { c: '#ffffff', p: 100 }] }; }
  var gBand = makeGrad($('geBand'), { mode: 'solid', angle: 90, stops: [{ c: '#1f4e9c', p: 0 }, { c: '#7fb0ff', p: 100 }] }, function () { render(); });
  var gBg = makeGrad($('geBg'), { mode: 'solid', angle: 90, stops: [{ c: '#ffffff', p: 0 }, { c: '#dbe6f7', p: 100 }] }, function () { render(); });
  var gOv = makeGrad($('geOv'), { mode: 'solid', angle: 90, stops: [{ c: '#ffffff', p: 0 }, { c: '#ffd24d', p: 100 }] }, function () { render(); });

  function vals() {
    return {
      orientation: state.orientation,
      name: $('name').value,
      role: $('role').value,
      idnum: $('idnum').value,
      org: $('org').value,
      issued: $('issued').value,
      expires: $('expires').value,
      band: gBand.get(),
      bgFill: gBg.get(),
      useBack: $('useBack').checked,
      backText: $('backText').value,
      zoom: $('zoom').value,
      panx: $('panx').value,
      pany: $('pany').value,
      photo: state.shown || state.photo,
      wmImg: state.wm,
      wmMode: $('wmMode').value,
      wmOpacity: $('wmOpacity').value,
      wmSize: $('wmSize').value,
      ovText: $('ovText').value,
      ovFill: gOv.get(),
      ovAngle: $('ovAngle').value,
      ovOpacity: $('ovOpacity').value,
      ovSize: $('ovSize').value
    };
  }

  function designOf(v) {
    return { orientation: v.orientation, org: v.org, role: v.role, issued: v.issued, expires: v.expires, band: v.band, bgFill: v.bgFill, useBack: v.useBack, backText: v.backText,
      wmImg: v.wmImg, wmMode: v.wmMode, wmOpacity: v.wmOpacity, wmSize: v.wmSize,
      ovText: v.ovText, ovFill: v.ovFill, ovAngle: v.ovAngle, ovOpacity: v.ovOpacity, ovSize: v.ovSize };
  }

  function cls(v, extra) {
    return 'badge' + (v.orientation === 'portrait' ? ' portrait' : '') + (extra ? ' ' + extra : '');
  }

  function frontHTML(v) {
    var tf = 'transform: translate(' + v.panx + '%, ' + v.pany + '%) scale(' + (v.zoom / 100) + ');';
    var hasWm = !!v.wmImg && v.wmMode !== 'off';
    var wmTag = function (where) {
      var s = parseInt(v.wmSize, 10) || 100;
      var o = (parseInt(v.wmOpacity, 10) || 40) / 100;
      return '<img class="wm ' + where + '" src="' + v.wmImg + '" alt="" style="opacity:' + o +
        ';width:' + s + '%;height:' + s + '%;left:' + ((100 - s) / 2) + '%;top:' + ((100 - s) / 2) + '%;">';
    };
    var img = '';
    if (hasWm && v.wmMode === 'behind') img += wmTag('behind');
    if (v.photo) img += '<img class="pic" src="' + v.photo + '" style="' + tf + '" alt="">';
    if (hasWm && v.wmMode === 'over') img += wmTag('over');
    if (v.ovText) {
      var line = esc(v.ovText);
      var ovCss = cssOf(v.ovFill);
      var fill = v.ovFill.mode === 'gradient'
        ? 'background-image:' + ovCss + ';-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;'
        : 'color:' + ovCss + ';';
      img += '<div class="ov" style="font-size:' + v.ovSize + 'pt;' + fill + 'opacity:' +
        ((parseInt(v.ovOpacity, 10) || 35) / 100) + ';transform:translate(-50%,-50%) rotate(' + (parseInt(v.ovAngle, 10) || 0) + 'deg);">' +
        line + '<br>' + line + '<br>' + line + '</div>';
    }
    var pcls = 'photo' + (hasWm && v.wmMode === 'behind' ? ' clean' : '');
    var meta = '';
    if (v.idnum) meta += 'ID ' + esc(v.idnum) + '<br>';
    if (v.issued) meta += 'Issued ' + esc(v.issued) + '<br>';
    if (v.expires) meta += 'Expires ' + esc(v.expires);
    return '<div class="band"><span>' + esc(v.org) + '</span></div>' +
      '<div class="' + pcls + '">' + img + '</div>' +
      '<div class="info"><div class="nm">' + esc(v.name) + '</div><div class="rl">' + esc(v.role) + '</div></div>' +
      '<div class="meta">' + meta + '</div>' +
      '<div class="stripe"></div>';
  }

  function backHTML(v) {
    return '<div class="band"><span>' + esc(v.org) + '</span></div>' +
      '<div class="btxt">' + esc(v.backText) + '</div>' +
      '<div class="stripe"></div>';
  }

  function render() {
    var v = vals();
    document.documentElement.style.setProperty('--band-fill', cssOf(v.band));
    document.documentElement.style.setProperty('--badge-bg', cssOf(v.bgFill));
    $('front').className = cls(v);
    $('front').innerHTML = frontHTML(v);
    $('back').className = cls(v, 'back');
    $('back').innerHTML = backHTML(v);
    $('backWrap').style.display = v.useBack ? 'block' : 'none';
    $('backFields').style.display = v.useBack ? 'block' : 'none';
    $('bgFields').style.display = $('bgOn').checked ? 'block' : 'none';
    $('modeL').className = v.orientation === 'landscape' ? 'on' : '';
    $('modeP').className = v.orientation === 'portrait' ? 'on' : '';
    $('pageStyle').textContent = v.orientation === 'portrait'
      ? '@page { size: 2.125in 3.375in; margin: 0; }'
      : '@page { size: 3.375in 2.125in; margin: 0; }';
  }

  /* template tabs */
  function drawChips() {
    var box = $('chips');
    box.innerHTML = '';
    var b = document.createElement('button');
    b.textContent = 'New';
    b.setAttribute('data-t', '');
    if (!state.tid) b.className = 'on';
    box.appendChild(b);
    db.templates.forEach(function (t) {
      var c = document.createElement('button');
      c.textContent = t.name + (t.orientation === 'portrait' ? ' (P)' : ' (L)');
      c.setAttribute('data-t', t.id);
      if (state.tid === t.id) c.className = 'on';
      box.appendChild(c);
    });
    $('tUpdate').style.display = state.tid ? 'block' : 'none';
    $('tDelete').style.display = state.tid ? 'block' : 'none';
    $('tNew').textContent = state.tid ? 'Save as another new template' : 'Save as new template';
  }

  function findT(id) {
    for (var i = 0; i < db.templates.length; i++) if (db.templates[i].id === id) return db.templates[i];
    return null;
  }

  function applyTemplate(t) {
    state.tid = t ? t.id : '';
    if (t) {
      state.orientation = t.orientation || 'landscape';
      $('org').value = t.org; $('role').value = t.role; $('issued').value = t.issued; $('expires').value = t.expires;
      gBand.set(t.band || solidOf(t.accent || '#1f4e9c'));
      gBg.set(t.bgFill || solidOf('#ffffff'));
      $('useBack').checked = !!t.useBack; $('backText').value = t.backText;
      $('tname').value = t.name;
      state.wm = t.wmImg || '';
      $('wmMode').value = t.wmMode || 'off';
      $('wmOpacity').value = t.wmOpacity || 40;
      $('wmSize').value = t.wmSize || 100;
      $('ovText').value = t.ovText || '';
      gOv.set(t.ovFill || solidOf(t.ovColor || '#ffffff'));
      $('ovAngle').value = (t.ovAngle !== undefined && t.ovAngle !== '') ? t.ovAngle : -24;
      $('ovOpacity').value = t.ovOpacity || 35;
      $('ovSize').value = t.ovSize || 16;
    } else {
      $('tname').value = '';
    }
    db.active = state.tid;
    saveDB(db);
    drawChips();
    drawRoster();
    render();
  }

  $('chips').addEventListener('click', function (e) {
    var id = e.target.getAttribute('data-t');
    if (id === null) return;
    applyTemplate(id ? findT(id) : null);
  });

  $('modeL').addEventListener('click', function () { state.orientation = 'landscape'; render(); });
  $('modeP').addEventListener('click', function () { state.orientation = 'portrait'; render(); });

  $('tNew').addEventListener('click', function () {
    var n = $('tname').value.trim();
    if (!n) { alert('Type a template name first.'); return; }
    var t = designOf(vals());
    t.id = newId(); t.name = n;
    db.templates.push(t);
    db.active = t.id;
    if (!saveDB(db)) { alert('Storage is full.'); return; }
    state.tid = t.id;
    drawChips(); drawRoster();
  });

  $('tUpdate').addEventListener('click', function () {
    var t = findT(state.tid);
    if (!t) return;
    var d = designOf(vals());
    for (var k in d) t[k] = d[k];
    var n = $('tname').value.trim();
    if (n) t.name = n;
    saveDB(db);
    drawChips();
  });

  $('tDelete').addEventListener('click', function () {
    var t = findT(state.tid);
    if (!t) return;
    if (!confirm('Delete this template and the people saved under it?')) return;
    db.templates = db.templates.filter(function (x) { return x.id !== t.id; });
    db.people = db.people.filter(function (p) { return p.tid !== t.id; });
    db.active = '';
    saveDB(db);
    applyTemplate(null);
  });

  /* photo */
  function resizeToDataURL(file, mime, max, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var im = new Image();
      im.onload = function () {
        var s = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        cb(mime === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.88));
      };
      im.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  $('photoIn').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    resizeToDataURL(f, 'image/jpeg', 700, function (url) {
      state.photo = url;
      state.shown = url;
      $('zoom').value = 100; $('panx').value = 0; $('pany').value = 0;
      autoKey(url, function (hex) {
        $('keyColor').value = hex;
        process();
      });
      render();
    });
  });

  $('wmIn').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    resizeToDataURL(f, 'image/png', 500, function (url) {
      state.wm = url;
      if ($('wmMode').value === 'off') $('wmMode').value = 'behind';
      render();
    });
  });

  $('wmClear').addEventListener('click', function () {
    state.wm = '';
    $('wmIn').value = '';
    render();
  });

  $('clearPhoto').addEventListener('click', function () {
    state.photo = '';
    state.shown = '';
    $('photoIn').value = '';
    render();
  });

  /* background removal by backdrop color */
  var imgCache = { src: '', im: null };
  function getImage(src, cb) {
    if (imgCache.src === src && imgCache.im) { cb(imgCache.im); return; }
    var im = new Image();
    im.onload = function () { imgCache = { src: src, im: im }; cb(im); };
    im.src = src;
  }
  function hexToRgb(h) {
    return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
  }
  function toHex(n) { var s = Math.round(n).toString(16); return s.length < 2 ? '0' + s : s; }
  function autoKey(src, cb) {
    getImage(src, function (im) {
      var w = 100, h = Math.max(1, Math.round(100 * im.height / im.width));
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var x = c.getContext('2d');
      x.drawImage(im, 0, 0, w, h);
      var p = 8, r = 0, g = 0, b = 0, n = 0;
      [[0, 0], [w - p, 0], [0, h - p], [w - p, h - p]].forEach(function (pt) {
        var d = x.getImageData(pt[0], pt[1], p, p).data;
        for (var i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
      });
      cb('#' + toHex(r / n) + toHex(g / n) + toHex(b / n));
    });
  }
  var procTimer = 0;
  function process() {
    clearTimeout(procTimer);
    procTimer = setTimeout(function () {
      var src = state.photo;
      if (!src || !$('bgOn').checked) { state.shown = src; render(); return; }
      var key = hexToRgb($('keyColor').value);
      var tol = parseInt($('bgTol').value, 10);
      getImage(src, function (im) {
        var s = Math.min(1, 520 / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        var x = c.getContext('2d');
        x.drawImage(im, 0, 0, c.width, c.height);
        var id = x.getImageData(0, 0, c.width, c.height);
        var d = id.data;
        var t0 = tol * 1.4, t1 = t0 + 40;
        for (var i = 0; i < d.length; i += 4) {
          var dr = d[i] - key[0], dg = d[i + 1] - key[1], db = d[i + 2] - key[2];
          var dist = Math.sqrt(dr * dr + dg * dg + db * db);
          var a = dist <= t0 ? 0 : (dist >= t1 ? 255 : (dist - t0) / (t1 - t0) * 255);
          if (a < d[i + 3]) d[i + 3] = a;
        }
        x.putImageData(id, 0, 0);
        if (src !== state.photo) return;
        state.shown = c.toDataURL('image/png');
        render();
      });
    }, 80);
  }
  ['bgOn', 'keyColor', 'bgTol'].forEach(function (id) {
    $(id).addEventListener('input', process);
    $(id).addEventListener('change', process);
  });

  ['name', 'role', 'idnum', 'org', 'issued', 'expires', 'useBack', 'backText', 'zoom', 'panx', 'pany',
    'wmMode', 'wmOpacity', 'wmSize', 'ovText', 'ovAngle', 'ovOpacity', 'ovSize']
    .forEach(function (id) {
      $(id).addEventListener('input', render);
      $(id).addEventListener('change', render);
    });

  $('printBtn').addEventListener('click', function () {
    var v = vals();
    var html = '<div class="' + cls(v) + '">' + frontHTML(v) + '</div>';
    if (v.useBack) html += '<div class="' + cls(v, 'back') + '">' + backHTML(v) + '</div>';
    $('printarea').innerHTML = html;
    window.print();
  });

  /* people under the active template */
  function drawRoster() {
    var t = findT(state.tid);
    $('rosterTitle').textContent = t ? ('People saved under ' + t.name) : 'People saved under New';
    var box = $('roster');
    var list = db.people.filter(function (p) { return p.tid === state.tid; });
    if (!list.length) { box.innerHTML = '<div class="empty">Nothing saved yet.</div>'; return; }
    box.innerHTML = '';
    list.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = '<div class="nm">' + esc(p.name || 'Unnamed') + '</div>' +
        '<div class="btns"><button class="small alt" data-load="' + p.pid + '">Load</button>' +
        '<button class="small alt" data-del="' + p.pid + '">Delete</button></div>';
      box.appendChild(row);
    });
  }

  $('roster').addEventListener('click', function (e) {
    var t = e.target;
    var lid = t.getAttribute('data-load');
    var did = t.getAttribute('data-del');
    if (lid !== null) {
      for (var i = 0; i < db.people.length; i++) {
        var p = db.people[i];
        if (p.pid === lid) {
          $('name').value = p.name; $('idnum').value = p.idnum;
          $('zoom').value = p.zoom; $('panx').value = p.panx; $('pany').value = p.pany;
          state.photo = p.photo || '';
          state.shown = state.photo;
          $('bgOn').checked = !!p.bgOn;
          if (p.keyColor) $('keyColor').value = p.keyColor;
          if (p.bgTol) $('bgTol').value = p.bgTol;
          render();
          process();
          window.scrollTo(0, 0);
          break;
        }
      }
    } else if (did !== null) {
      db.people = db.people.filter(function (p) { return p.pid !== did; });
      saveDB(db);
      drawRoster();
    }
  });

  $('savePerson').addEventListener('click', function () {
    var v = vals();
    var rec = { pid: '', tid: state.tid, name: v.name, idnum: v.idnum, zoom: v.zoom, panx: v.panx, pany: v.pany, photo: state.photo,
      bgOn: $('bgOn').checked, keyColor: $('keyColor').value, bgTol: $('bgTol').value };
    var found = -1;
    for (var i = 0; i < db.people.length; i++) {
      if (db.people[i].tid === state.tid && db.people[i].name === v.name && db.people[i].idnum === v.idnum) { found = i; break; }
    }
    if (found >= 0) { rec.pid = db.people[found].pid; db.people[found] = rec; }
    else { rec.pid = newId(); db.people.push(rec); }
    if (!saveDB(db)) { alert('Storage is full. Delete a saved person and try again.'); return; }
    drawRoster();
  });

  /* start on the last template used */
  var start = db.active ? findT(db.active) : null;
  applyTemplate(start);
})();
</script>
</body>
</html>
